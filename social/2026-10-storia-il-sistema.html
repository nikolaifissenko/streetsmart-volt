<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,700;0,800;1,400&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: #EDE8DF; }
  body { position: relative; font-family: 'Inter', sans-serif; color: #1a1a1a; }
  .kicker { position: absolute; left: 104px; top: 150px; font-family: 'EB Garamond', serif; font-style: italic; font-size: 64px; color: #2E2820; }
  .logo { position: absolute; right: 70px; top: 60px; width: 250px; height: 250px; }
  .list { position: absolute; left: 120px; right: 80px; top: 380px; display: flex; flex-direction: column; gap: 78px; }
  .row { display: flex; align-items: center; gap: 72px; }
  .dot { width: 220px; height: 220px; border-radius: 50%; flex-shrink: 0; }
  .name { font-family: 'EB Garamond', serif; font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: 0.01em; }
  .name span { font-weight: 400; }
  .desc { font-size: 38px; line-height: 1.3; margin-top: 14px; color: #2a2a2a; }
</style></head>
<body>
  <div class="kicker">il sistema</div>
  <img class="logo" src="../streetsmart_logo.png" alt="StreetSmart">
  <div class="list">
    <div class="row"><div class="dot" style="background:#27AE60"></div><div><div class="name">VERDE <span>—</span></div><div class="desc">Pista ciclabile agevole.</div></div></div>
    <div class="row"><div class="dot" style="background:#e6940a"></div><div><div class="name">GIALLO <span>—</span></div><div class="desc">Strada urbana<br>a senso unico.</div></div></div>
    <div class="row"><div class="dot" style="background:#e53935"></div><div><div class="name">ROSSO <span>—</span></div><div class="desc">Strada a doppio senso<br>o arteria senza ciclabile.</div></div></div>
    <div class="row"><div class="dot" style="background:#1a1a1a"></div><div><div class="name">NERO <span>—</span></div><div class="desc">Multicorsia<br>senza ciclabile.</div></div></div>
    <div class="row"><div class="dot" style="background:#1976D2"></div><div><div class="name">BLU <span>—</span></div><div class="desc">Zona centrale ad alta<br>affluenza pedonale.</div></div></div>
  </div>
</body></html>
