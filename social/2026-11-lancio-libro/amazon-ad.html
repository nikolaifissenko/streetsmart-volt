<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,700;0,800;1,400&family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#EDE8DF;font-family:'Inter',sans-serif;color:#1a1a1a;position:relative;overflow:hidden}
.stripes{position:absolute;left:-100px;right:-100px;top:640px;height:300px;transform:rotate(-12deg)}
.stripes div{height:60px}
.kick{position:absolute;top:80px;left:0;right:0;text-align:center;font:600 24px 'Inter';letter-spacing:.25em;text-transform:uppercase;color:#6b6255}
.h{position:absolute;top:128px;left:0;right:0;text-align:center;font:800 104px/1 'EB Garamond'}
.h span{color:#B8352A}
.cover{position:absolute;left:50%;top:280px;width:470px;transform:translateX(-50%) rotate(-3deg);box-shadow:0 30px 60px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.2);border-radius:4px}
.badge{position:absolute;left:0;right:0;bottom:130px;text-align:center}
.badge b{display:inline-block;background:#1a1a1a;color:#fff;font:700 40px 'Inter';padding:22px 54px;border-radius:999px}
.badge b i{font-style:normal;color:#FF9900}
.sub{position:absolute;left:0;right:0;bottom:70px;text-align:center;font:italic 400 34px 'EB Garamond';color:#2E2820}
</style></head><body>
<div class="stripes"><div style="background:#C0453A"></div><div style="background:#E09A3E"></div><div style="background:#4677A8"></div><div style="background:#4C9A5A"></div><div style="background:#3A332D"></div></div>
<div class="kick">Il libro StreetSmart</div>
<div class="h">È <span>uscito.</span></div>
<img class="cover" src="../../libro/cover-it.jpg">
<div class="badge"><b>Disponibile su <i>Amazon</i></b></div>
<div class="sub">Cartaceo e Kindle · per ciclisti urbani</div>
</body></html>
