<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,700;0,800;1,400&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ccc; font-family: 'Inter', sans-serif; color: #1a1a1a; }
  /* 1080x1920 (9:16). Contenuto chiave dentro la fascia centrale 1080x1440 (crop 3:4 della griglia profilo IG) */
  .c { width: 1080px; height: 1920px; background: #EDE8DF; position: relative; overflow: hidden; }
  .bar { position: absolute; left: 0; top: 0; width: 26px; height: 100%; background: #e53935; }
  .logo { position: absolute; right: 70px; top: 290px; width: 150px; }
  .kick { position: absolute; left: 100px; top: 320px; font: 600 28px 'Inter'; letter-spacing: .22em; text-transform: uppercase; color: #6b6255; }
  .num { position: absolute; left: 92px; top: 390px; font: 800 250px/1 'EB Garamond'; color: #e53935; }
  .title { position: absolute; left: 100px; right: 90px; top: 660px; font: 800 132px/1 'EB Garamond'; }
  .book { position: absolute; right: 90px; top: 1080px; width: 310px; transform: rotate(5deg); box-shadow: 0 30px 60px rgba(0,0,0,.3); }
  .sub { position: absolute; left: 100px; top: 1200px; width: 520px; font: italic 400 56px/1.15 'EB Garamond'; color: #2E2820; }
  .cta { position: absolute; left: 100px; top: 1420px; font: 600 30px 'Inter'; letter-spacing: .14em; text-transform: uppercase; color: #B8352A; }
</style></head>
<body>
<div class="c" id="cover">
  <div class="bar"></div>
  <img class="logo" src="../../streetsmart_logo.png">
  <div class="kick">Il Codice della Sopravvivenza</div>
  <div class="num">Art. 9</div>
  <div class="title">L'indeciso viene asfaltato.</div>
  <div class="sub">16 articoli per uscire vivi dalle strade di Roma.</div>
  <img class="book" src="../../libro/cover-it.jpg">
  <div class="cta">POV: pedali a Roma</div>
</div>
</body></html>
